name: Wrestling Digest Watchdog

# Safety net for the external cron-job.org trigger (10:00 Asia/Jerusalem) ever
# failing to fire run.yml.
#
# No native `schedule:` trigger here (2026-09-02): GitHub's own cron is exactly
# the unreliable-timing problem run.yml was moved off of (see wrestling-digest
# loop notes 2026-08-29) — using it here too just relocated the same flakiness
# instead of removing it, and needed a dual cron hack for DST. This workflow is
# now fired the same way run.yml is: an external cron-job.org job calling
# workflow_dispatch (10:45 Asia/Jerusalem, native timezone — no UTC/DST math),
# ~45min after the expected 10:00 IL run.
#
# No "already ran today?" check here: that logic hit a GitHub API
# eventual-consistency false negative on 2026-09-02 — saw count=0 for a run
# that had already succeeded hours earlier — and fired a real duplicate. The
# once-a-day gate now lives in run.yml itself (the `guard` job there), so this
# workflow can just always dispatch and let run.yml decide whether to no-op.
on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Fire run.yml (it no-ops itself if today's digest already ran)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run run.yml --repo ${{ github.repository }}
