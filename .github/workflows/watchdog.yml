name: Wrestling Digest Watchdog

# Safety net for the external cron-job.org trigger (10:00 Asia/Jerusalem) ever
# failing to fire run.yml — run.yml itself has no native `schedule:` trigger
# anymore (GitHub's own cron repeatedly fired hours late or not at all, see
# wrestling-digest loop notes 2026-08-29). Fires ~30-90min after the expected
# 10:00 IL trigger, checks whether a successful run already happened today, and
# if not, fires one via workflow_dispatch. Dual cron for DST-proofing (no manual
# edits at changeovers) — whichever lands later than 10:00 IL that day just finds
# count>0 from the earlier one and no-ops.
on:
  schedule:
    - cron: "30 7 * * *"   # 10:30 Israel (summer, UTC+3)
    - cron: "30 8 * * *"   # 10:30 Israel (winter, UTC+2)
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a successful run.yml run today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/run.yml/runs?status=success&per_page=10" \
            -q "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")
          echo "Successful runs today: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Trigger run.yml if missing
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "No successful run today — GitHub likely dropped the scheduled trigger. Firing manually."
          gh workflow run run.yml
