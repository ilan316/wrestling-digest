name: Wrestling Digest Watchdog

# Safety net for GitHub's own scheduler dropping cron runs (happens during
# platform incidents — see githubstatus.com). Runs after both candidate
# windows of run.yml (04:43 / 05:43 UTC) have had time to finish, checks
# whether a successful run already happened today, and if not, fires one
# via workflow_dispatch.
on:
  schedule:
    - cron: "15 6 * * *"   # 09:15 Israel (summer) / 08:15 (winter) — buffer past both windows
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a successful run.yml run today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/run.yml/runs?status=success&per_page=10" \
            -q "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\"))] | length")
          echo "Successful runs today: $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Trigger run.yml if missing
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "No successful run today — GitHub likely dropped the scheduled trigger. Firing manually."
          gh workflow run run.yml
