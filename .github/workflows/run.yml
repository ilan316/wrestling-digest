name: Wrestling Digest

on:
  # No native `schedule:` trigger — GitHub's cron repeatedly fired hours late or
  # not at all (see wrestling-digest loop notes 2026-08-29). The sole daily trigger
  # is now an external cron-job.org job (10:00 Asia/Jerusalem, native timezone —
  # no UTC/DST math) calling this via the GitHub API. watchdog.yml is the fallback
  # if that external call ever fails.
  workflow_dispatch:       # manual trigger from GitHub UI, or from cron-job.org / watchdog
    inputs:
      dry_run:
        description: "Dry run — exercise secrets and the model without sending mail or touching docs/ (stays off the strong model's 20/day budget)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  guard:
    # Once-a-day gate, enforced here so it holds no matter who dispatched this
    # run (cron-job.org, watchdog.yml, or a human) — a duplicate trigger from
    # any of those just no-ops instead of sending a second real digest email.
    # Dry runs skip the gate: they don't send mail or touch docs/, so repeats
    # are harmless and useful for testing.
    runs-on: ubuntu-latest
    outputs:
      already_ran: ${{ steps.check.outputs.already_ran }}
      can_defer: ${{ steps.check.outputs.can_defer }}
    steps:
      - name: Check for a successful run today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Filter conclusion client-side: the server-side --status=success filter
          # returns a stale, unsorted set that can miss today's runs entirely.
          COUNT=$(gh run list --repo ${{ github.repository }} --workflow=run.yml \
            --limit 20 --json createdAt,conclusion \
            --jq "[.[] | select(.conclusion == \"success\" and (.createdAt | startswith(\"$TODAY\")))] | length")
          echo "Successful real runs today so far: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi
          # First real attempt today may defer (exit non-zero, no digest) when
          # Gemini can't group the articles, leaving it to the watchdog run.
          # Any earlier failed run today means this IS the retry — never defer
          # again, fall back to local grouping and send.
          FAILED=$(gh run list --repo ${{ github.repository }} --workflow=run.yml \
            --limit 20 --json createdAt,conclusion \
            --jq "[.[] | select(.conclusion == \"failure\" and (.createdAt | startswith(\"$TODAY\")))] | length")
          echo "Failed runs today so far: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "can_defer=0" >> "$GITHUB_OUTPUT"
          else
            echo "can_defer=1" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: guard
    if: ${{ inputs.dry_run || needs.guard.outputs.already_ran != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wrestling-digest
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DIGEST_CAN_DEFER: ${{ needs.guard.outputs.can_defer }}
        # `inputs` is null on schedule runs, so this collapses to a plain run.
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Publish digest page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update digest $(date +%Y-%m-%d)"
          git pull --rebase origin master
          git push
